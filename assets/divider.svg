<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 14" width="1200" height="14">
  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ef0ff" stop-opacity="0"/><stop offset=".5" stop-color="#5ef0ff"/><stop offset="1" stop-color="#ff4fd8" stop-opacity="0"/>
    </linearGradient>
    <style>.dot{animation:m 4s linear infinite}@keyframes m{from{transform:translateX(0)}to{transform:translateX(1200px)}}</style>
  </defs>
  <rect x="0" y="6" width="1200" height="2" fill="url(#l)"/>
  <circle class="dot" cx="0" cy="7" r="4" fill="#ff4fd8"/>
</svg>
